<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>اختبار إشعارات Firebase</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    .card{width:min(92%,520px);background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:24px;box-sizing:border-box}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:#1976d2;color:#fff;font-size:16px;cursor:pointer}
    button:disabled{opacity:.5}
    #status{margin-top:16px;line-height:1.7;word-break:break-word}
    code{background:#000;padding:3px 6px;border-radius:5px}
  </style>
</head>
<body>
  <main class="card">
    <h2>اختبار إشعارات Firebase</h2>
    <p>اضغط الزر لمنح الموقع إذن الإشعارات وتسجيل الجهاز في Firebase Cloud Messaging.</p>
    <button id="enable">تفعيل الإشعارات</button>
    <div id="status">الحالة: لم يبدأ الاختبار.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg",
      authDomain: "hhhxh-5ebe4.firebaseapp.com",
      projectId: "hhhxh-5ebe4",
      storageBucket: "hhhxh-5ebe4.firebasestorage.app",
      messagingSenderId: "79243000696",
      appId: "1:79243000696:web:ee0fb2d2ccce791954e68d",
      measurementId: "G-08BR6LN6PT"
    };

    const vapidKey = "BNyvEQlN4tst9Z73YwbcIoHXoBhUn2PrDFww36Liv-7OrByaSG7fgEJe422yNPDr1fPYjMOOaID2_Hqp00-mrTA";
    const status = document.getElementById("status");
    const button = document.getElementById("enable");

    const setStatus = (text) => status.textContent = "الحالة: " + text;

    try {
      const supported = await isSupported();
      if (!supported) {
        button.disabled = true;
        setStatus("المتصفح لا يدعم Firebase Cloud Messaging على هذا الجهاز.");
      }
    } catch (e) {
      console.error(e);
    }

    button.addEventListener("click", async () => {
      try {
        if (!("Notification" in window)) throw new Error("الإشعارات غير مدعومة في هذا المتصفح.");
        if (!window.isSecureContext) throw new Error("يجب تشغيل الموقع عبر HTTPS (أو localhost أثناء الاختبار).");

        setStatus("يتم طلب إذن الإشعارات...");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") throw new Error("لم يتم منح إذن الإشعارات.");

        const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
        setStatus("تم تسجيل Service Worker، جارٍ الحصول على رمز الجهاز...");

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        const token = await getToken(messaging, {
          vapidKey,
          serviceWorkerRegistration: registration
        });

        if (!token) throw new Error("لم يتم الحصول على FCM token.");

        console.log("FCM REGISTRATION TOKEN:", token);
        setStatus("تم التفعيل. افتح Console وانسخ FCM Registration Token لاختبار إرسال إشعار من Firebase Console.");

        onMessage(messaging, (payload) => {
          console.log("رسالة أثناء فتح الموقع:", payload);
        });
      } catch (error) {
        console.error(error);
        setStatus(error.message || String(error));
      }
    });
  </script>
</body>
</html>
